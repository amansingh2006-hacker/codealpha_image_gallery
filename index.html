<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Gallery</title>
<style>
:root{--bg:#eef1f6;--ink:#17202b;--muted:#5d6b7a;--card:#dfe5ee;--accent:#3d63dd;--accent-ink:#fff;--heart:#e5384f;--hot:#f0a500}
@media (prefers-color-scheme: dark){:root{--bg:#12161d;--ink:#eef1f5;--muted:#93a0b0;--card:#1c232d;--accent:#7a9cff;--accent-ink:#0d1420}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif}
header{max-width:1100px;margin:0 auto;padding:36px 20px 12px}
h1{margin:0 0 6px;font-size:clamp(1.8rem,5vw,2.8rem)}
header p{margin:0 0 18px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar input[type=search]{flex:1;min-width:180px;padding:10px 14px;border-radius:99px;border:2px solid var(--card);background:var(--card);color:var(--ink);font:inherit}
.bar input[type=search]:focus{border-color:var(--accent);outline:none}
.btn{font:inherit;padding:9px 16px;border-radius:99px;border:2px solid var(--accent);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.btn.active{background:var(--accent);color:var(--accent-ink)}
.btn small{opacity:.7;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.status{max-width:1100px;margin:0 auto;padding:0 20px;color:var(--muted);font-size:.9rem}
.gallery{max-width:1100px;margin:0 auto;padding:12px 20px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.item{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.14);animation:in .35s both}
@keyframes in{from{opacity:0;transform:scale(.96)}}
.item.load::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.open{position:absolute;inset:0;border:0;padding:0;background:none;cursor:pointer;width:100%}
.item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.item:hover img,.open:focus-visible img{transform:scale(1.08)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.78));transform:translateY(100%);transition:transform .3s;pointer-events:none}
.item:hover .cap,.open:focus-visible+.cap{transform:none}
.cap small{display:block;opacity:.75}
.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:1.15rem;cursor:pointer;z-index:2;transition:transform .15s,background .2s}
.heart:hover{background:rgba(0,0,0,.65)}
.heart:active{transform:scale(.88)}
.heart.on{color:var(--heart);background:rgba(255,255,255,.92)}
.open:focus-visible,.heart:focus-visible,.btn:focus-visible,.lb button:focus-visible,.lb a:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0}
/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(8,11,16,.95);display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:20;color:#e8ecf2}
.lb.open{opacity:1;visibility:visible}
.stage{width:92vw;height:70vh;display:grid;place-items:center;overflow:hidden;border-radius:8px}
.lb img{max-width:100%;max-height:100%;border-radius:8px;transition:opacity .25s,transform .25s;cursor:zoom-in;user-select:none}
.lb img.zoom{cursor:zoom-out;transform:scale(2.2)}
.lb figcaption{margin-top:10px;text-align:center}
.lb figure{margin:0}
.lb .tb{position:absolute;top:12px;right:12px;display:flex;gap:8px}
.lb button,.lb a.ic{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:1.25rem;cursor:pointer;transition:background .2s;display:grid;place-items:center;text-decoration:none}
.lb button:hover,.lb a.ic:hover{background:rgba(255,255,255,.28)}
.lb .prev,.lb .next{position:absolute;top:50%;transform:translateY(-50%);font-size:1.6rem}
.lb .prev{left:12px}.lb .next{right:12px}
.lb #fav.on{color:var(--heart)}
.lb #play.on{background:var(--accent);color:var(--accent-ink)}
.strip{display:flex;gap:6px;margin-top:12px;max-width:92vw;overflow-x:auto;padding:4px}
.strip img{width:56px;height:42px;object-fit:cover;border-radius:5px;opacity:.5;cursor:pointer;flex:none;max-width:none;max-height:none;transition:opacity .2s}
.strip img.cur{opacity:1;outline:2px solid var(--accent)}
@media (max-width:520px){.lb .prev,.lb .next{top:auto;bottom:80px;transform:none}.stage{height:60vh}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Image Gallery</h1>
  <p>Click a photo to open it. Use ♥ to save favorites, or add your own photos.</p>
  <div class="bar">
    <input type="search" id="q" placeholder="Search photos" aria-label="Search photos">
    <button class="btn" id="shuffle">Shuffle</button>
    <label class="btn" for="up" tabindex="0" id="upLbl">＋ Add photos</label>
    <input type="file" id="up" accept="image/*" multiple hidden>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
</header>
<p class="status" id="status" aria-live="polite"></p>
<main class="gallery" id="gallery"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="tb">
    <button id="fav" aria-label="Favorite" title="Favorite (F)">♡</button>
    <button id="play" aria-label="Start slideshow" title="Slideshow (Space)">▶</button>
    <button id="fs" aria-label="Fullscreen" title="Fullscreen">⛶</button>
    <a class="ic" id="orig" target="_blank" rel="noopener" aria-label="Open original" title="Open original">↗</a>
    <button id="close" aria-label="Close" title="Close (Esc)">✕</button>
  </div>
  <button class="prev" id="prev" aria-label="Previous image">‹</button>
  <figure><div class="stage" id="stage"><img id="lbImg" alt=""></div><figcaption id="lbCap"></figcaption></figure>
  <div class="strip" id="strip"></div>
  <button class="next" id="next" aria-label="Next image">›</button>
</div>

<script>
// Add your own photos here: put files in an /images folder and use "images/name.jpg" as thumb and full.
// Or use the "Add photos" button to view pictures from your device.
const P = id => `https://picsum.photos/id/${id}/`;
const photos = [
  {id:10,  cat:'Nature',  title:'Forest light'},
  {id:15,  cat:'Nature',  title:'Mountain stream'},
  {id:28,  cat:'Nature',  title:'Pine hill'},
  {id:29,  cat:'Nature',  title:'Misty peaks'},
  {id:1015,cat:'Nature',  title:'River valley'},
  {id:1018,cat:'Nature',  title:'Mountain mist'},
  {id:1043,cat:'Nature',  title:'Quiet lake'},
  {id:1059,cat:'Nature',  title:'Autumn path'},
  {id:164, cat:'City',    title:'Street corner'},
  {id:274, cat:'City',    title:'City bridge'},
  {id:325, cat:'City',    title:'Rooftops'},
  {id:380, cat:'City',    title:'Night traffic'},
  {id:1031,cat:'Travel',  title:'Open road'},
  {id:1036,cat:'Travel',  title:'Snowy trail'},
  {id:1039,cat:'Travel',  title:'Waterfall'},
  {id:1040,cat:'Travel',  title:'Old castle'},
  {id:1074,cat:'Animals', title:'Lion rest'},
  {id:237, cat:'Animals', title:'Black puppy'},
  {id:169, cat:'Animals', title:'Curious dog'},
  {id:1025,cat:'Animals', title:'Pug in blanket'}
].map(p => ({...p, key:'p'+p.id, thumb:P(p.id)+'600/450', full:P(p.id)+'1400/1000'}));

const $ = id => document.getElementById(id);
const gallery = $('gallery'), filters = $('filters'), lb = $('lb'), lbImg = $('lbImg');
let favs = [];
try { favs = JSON.parse(localStorage.getItem('gal-favs') || '[]'); } catch(e){}
const saveFavs = () => { try { localStorage.setItem('gal-favs', JSON.stringify(favs)); } catch(e){} };
let cat = 'All', query = '', visible = [], pos = 0, opener = null, timer = null;

const isFav = p => favs.includes(p.key);
const cats = () => ['All', ...new Set(photos.map(p => p.cat)), 'Favorites'];
const inCat = (p, c) => c === 'All' || (c === 'Favorites' ? isFav(p) : p.cat === c);

function renderFilters(){
  filters.innerHTML = '';
  cats().forEach(c => {
    const n = photos.filter(p => inCat(p, c)).length;
    const b = document.createElement('button');
    b.className = 'btn' + (c === cat ? ' active' : ''); b.dataset.cat = c;
    b.innerHTML = `${c === 'Favorites' ? '♥ ' : ''}${c}<small>${n}</small>`;
    filters.appendChild(b);
  });
}
function render(){
  const q = query.trim().toLowerCase();
  visible = photos.filter(p => inCat(p, cat) && (!q || (p.title + ' ' + p.cat).toLowerCase().includes(q)));
  gallery.innerHTML = '';
  $('status').textContent = `${visible.length} photo${visible.length === 1 ? '' : 's'}`;
  if(!visible.length){
    gallery.innerHTML = `<p class="empty">${cat === 'Favorites' && !q ? 'No favorites yet. Tap ♥ on any photo to save it here.' : 'No photos match. Try another search or category.'}</p>`;
    return;
  }
  visible.forEach(p => {
    const d = document.createElement('div');
    d.className = 'item load'; d.dataset.key = p.key;
    d.innerHTML = `<button class="open" aria-label="Open ${p.title}"><img loading="lazy" src="${p.thumb}" alt="${p.title}"></button><span class="cap">${p.title}<small>${p.cat}</small></span><button class="heart ${isFav(p) ? 'on' : ''}" aria-label="Toggle favorite for ${p.title}" aria-pressed="${isFav(p)}">${isFav(p) ? '♥' : '♡'}</button>`;
    const img = d.querySelector('img');
    img.onload = () => d.classList.remove('load');
    img.onerror = () => { img.style.display = 'none'; d.classList.remove('load'); };   // keeps layout if offline
    gallery.appendChild(d);
  });
}
function toggleFav(p){
  const k = favs.indexOf(p.key);
  k >= 0 ? favs.splice(k, 1) : favs.push(p.key);
  saveFavs(); renderFilters();
  if(cat === 'Favorites' && !lb.classList.contains('open')) render();
}

filters.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  cat = b.dataset.cat; renderFilters(); render();
});
$('q').addEventListener('input', e => { query = e.target.value; render(); });
$('shuffle').onclick = () => {
  for(let i = photos.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [photos[i], photos[j]] = [photos[j], photos[i]]; }
  render();
};
$('upLbl').onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); $('up').click(); } };
$('up').addEventListener('change', e => {
  [...e.target.files].forEach(f => {
    const url = URL.createObjectURL(f);
    photos.unshift({key:'u' + f.name + f.size, cat:'My photos', title:f.name.replace(/\.[^.]+$/, ''), thumb:url, full:url});
  });
  cat = 'My photos'; renderFilters(); render(); e.target.value = '';
});
gallery.addEventListener('click', e => {
  const item = e.target.closest('.item'); if(!item) return;
  const p = photos.find(x => x.key === item.dataset.key);
  if(e.target.closest('.heart')){
    toggleFav(p);
    const h = item.querySelector('.heart'), on = isFav(p);
    h.classList.toggle('on', on); h.textContent = on ? '♥' : '♡'; h.setAttribute('aria-pressed', on);
    if(cat === 'Favorites' && !on) render();
  } else if(e.target.closest('.open')) open(p.key);
});

// ---------- Lightbox ----------
function updateFavBtn(p){
  const on = isFav(p);
  $('fav').textContent = on ? '♥' : '♡'; $('fav').classList.toggle('on', on);
  $('fav').setAttribute('aria-label', on ? 'Remove from favorites' : 'Add to favorites');
}
function buildStrip(){
  $('strip').innerHTML = '';
  visible.forEach((p, i) => {
    const t = document.createElement('img'); t.src = p.thumb; t.alt = p.title; t.onclick = () => show(i);
    $('strip').appendChild(t);
  });
}
function show(n){
  pos = (n + visible.length) % visible.length;
  const p = visible[pos];
  lbImg.classList.remove('zoom'); lbImg.style.opacity = 0;
  lbImg.onload = () => lbImg.style.opacity = 1;
  lbImg.src = p.full; lbImg.alt = p.title;
  $('lbCap').textContent = `${p.title} (${pos + 1} of ${visible.length})`;
  $('orig').href = p.full; updateFavBtn(p);
  [...$('strip').children].forEach((t, i) => { t.classList.toggle('cur', i === pos); if(i === pos) t.scrollIntoView({block:'nearest', inline:'center'}); });
  const nx = new Image(); nx.src = visible[(pos + 1) % visible.length].full;   // preload next
}
function open(key){
  opener = document.activeElement;
  pos = Math.max(0, visible.findIndex(p => p.key === key));
  lb.classList.add('open'); buildStrip(); show(pos);
  $('close').focus(); document.body.style.overflow = 'hidden';
}
function close(){
  stopShow();
  if(document.fullscreenElement) document.exitFullscreen();
  lb.classList.remove('open'); document.body.style.overflow = '';
  if(cat === 'Favorites') render();
  opener && opener.focus();
}
function startShow(){ timer = setInterval(() => show(pos + 1), 3000); $('play').textContent = '⏸'; $('play').classList.add('on'); $('play').setAttribute('aria-label', 'Stop slideshow'); }
function stopShow(){ clearInterval(timer); timer = null; $('play').textContent = '▶'; $('play').classList.remove('on'); $('play').setAttribute('aria-label', 'Start slideshow'); }
const toggleShow = () => timer ? stopShow() : startShow();

$('next').onclick = () => show(pos + 1);
$('prev').onclick = () => show(pos - 1);
$('close').onclick = close;
$('play').onclick = toggleShow;
$('fav').onclick = () => { const p = visible[pos]; toggleFav(p); updateFavBtn(p); };
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : lb.requestFullscreen && lb.requestFullscreen();
lbImg.onclick = () => lbImg.classList.toggle('zoom');
$('stage').addEventListener('mousemove', e => {
  if(!lbImg.classList.contains('zoom')) return;
  const r = $('stage').getBoundingClientRect();
  lbImg.style.transformOrigin = `${(e.clientX - r.left) / r.width * 100}% ${(e.clientY - r.top) / r.height * 100}%`;
});
lb.addEventListener('click', e => { if(e.target === lb) close(); });
document.addEventListener('keydown', e => {
  if(!lb.classList.contains('open')) return;
  if(e.key === 'Escape') close();
  else if(e.key === 'ArrowRight') show(pos + 1);
  else if(e.key === 'ArrowLeft') show(pos - 1);
  else if(e.key.toLowerCase() === 'f') $('fav').click();
  else if(e.code === 'Space' && e.target.tagName !== 'BUTTON'){ e.preventDefault(); toggleShow(); }
});
// Swipe on touch screens
let x0 = null;
lb.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
lb.addEventListener('touchend', e => { if(x0 === null) return; const d = e.changedTouches[0].clientX - x0; if(Math.abs(d) > 50) show(pos + (d < 0 ? 1 : -1)); x0 = null; });

renderFilters(); render();
</script>
</body>
</html>
